[project]
name = "comfyui-seamrank"
version = "0.1.0"
description = "Rank multiple continuation clips by visual seam continuity and recommend duplicate-frame trims."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "A ad钙"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/Ye-Zayne/comfyui-seamrank"
"Bug Tracker" = "https://github.com/Ye-Zayne/comfyui-seamrank/issues"

[tool.comfy]
PublisherId = "jinny-wj"
DisplayName = "SeamRank"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.optional-dependencies]
flow = ["opencv-python-headless>=4.8"]
